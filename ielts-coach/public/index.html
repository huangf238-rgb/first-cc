<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b6a86">
  <meta name="color-scheme" content="light dark">
  <title>雅思口语教练</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b6a86'/%3E%3Cpath d='M32 14a8 8 0 0 0-8 8v10a8 8 0 0 0 16 0V22a8 8 0 0 0-8-8zm-14 18h4a10 10 0 0 0 20 0h4a14 14 0 0 1-12 13.9V52h-4v-6.1A14 14 0 0 1 18 32z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="app">
    <header class="top">
      <div class="brand">雅思口语教练</div>
      <div class="top-meta" id="topMeta"></div>
    </header>
    <div id="banner" class="banner" hidden></div>
    <main id="main" aria-live="polite"><p class="loading">加载中…</p></main>
    <nav class="tabs" id="tabs" hidden aria-label="功能">
      <button type="button" data-view="shadow" id="tab-shadow">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3zM6 11h1.6a4.4 4.4 0 0 0 8.8 0H18a6 6 0 0 1-5.2 5.95V20h-1.6v-3.05A6 6 0 0 1 6 11z"/></svg>
        <span>跟读</span>
      </button>
      <button type="button" data-view="speak" id="tab-speak">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v10H9l-5 4V5zm2 2v7.9L8.4 13H18V7H6z"/></svg>
        <span>口语</span>
      </button>
      <button type="button" data-view="listen" id="tab-listen">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4a8 8 0 0 0-8 8v6a2 2 0 0 0 2 2h2v-7H6v-1a6 6 0 0 1 12 0v1h-2v7h2a2 2 0 0 0 2-2v-6a8 8 0 0 0-8-8z"/></svg>
        <span>听力</span>
      </button>
      <button type="button" data-view="report" id="tab-report">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19V10h3v9H5zm5.5 0V5h3v14h-3zM16 19v-6h3v6h-3z"/></svg>
        <span>报告</span>
      </button>
      <button type="button" data-view="settings" id="tab-settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7zm8.4 4.6-1.9-.4a6.9 6.9 0 0 1-.6 1.5l1.1 1.6-1.7 1.7-1.6-1.1a6.9 6.9 0 0 1-1.5.6l-.4 1.9h-2.4l-.4-1.9a6.9 6.9 0 0 1-1.5-.6l-1.6 1.1-1.7-1.7 1.1-1.6a6.9 6.9 0 0 1-.6-1.5l-1.9-.4v-2.4l1.9-.4c.1-.5.3-1 .6-1.5L4.6 6.4l1.7-1.7 1.6 1.1c.5-.3 1-.5 1.5-.6l.4-1.9h2.4l.4 1.9c.5.1 1 .3 1.5.6l1.6-1.1 1.7 1.7-1.1 1.6c.3.5.5 1 .6 1.5l1.9.4v2.4z"/></svg>
        <span>设置</span>
      </button>
    </nav>
  </div>
  <div id="toast" class="toast" hidden role="status"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
